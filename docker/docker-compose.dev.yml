version: '3.8'

# Development-specific docker-compose override
services:
  # Database with development settings
  postgres:
    environment:
      POSTGRES_DB: todo_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Redis with development settings
  redis:
    ports:
      - "6379:6379"

  # Backend with hot reload
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      target: base
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/todo_dev
      JWT_SECRET: dev-secret-key
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - ../packages/backend/src:/app/packages/backend/src:ro
      - ../packages/shared:/app/packages/shared:ro
      - backend_node_modules:/app/packages/backend/node_modules
    command: ["npm", "run", "dev", "--workspace=backend"]
    ports:
      - "3000:3000"
      - "9229:9229" # Debug port

  # Frontend with hot reload
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: base
    environment:
      VITE_API_URL: http://localhost:3000/api
      VITE_WS_URL: ws://localhost:3000
    volumes:
      - ../packages/frontend/src:/app/packages/frontend/src:ro
      - ../packages/shared:/app/packages/shared:ro
      - frontend_node_modules:/app/packages/frontend/node_modules
    command: ["npm", "run", "dev", "--workspace=frontend"]
    ports:
      - "5173:5173"

  # Development database admin
  adminer:
    profiles: [] # Always include in development

volumes:
  postgres_dev_data:
    driver: local
  backend_node_modules:
    driver: local
  frontend_node_modules:
    driver: local